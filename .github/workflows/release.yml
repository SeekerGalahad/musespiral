name: Release

# W1-B3 发版流水线（2026-11-23，正典=docs/项目方案/musespiral-运维发布改良设计-2026-11-23.md §二）。
#
# 与 scripts/release.sh 的分工（互补不重复）：
#   本 workflow（CI）＝ tag push 触发的「测试 → 构建 → wheel pycache 断言 → GitHub Release 附产物」；
#   PyPI 上传 ＝ 本地 `bash scripts/release.sh --upload`（判例 J9：PyPI token 不进 CI secret、
#   不进任何 tracked 文件——凭证不出本机；CI 到 gh release 为止）。
#
# 判例 J4 机器化：`plugins_builtin/**` 递归 package-data glob 会把本地跑测试留下的
#   __pycache__/*.pyc 混进 wheel（0.5.0 真缺陷，12 个 .pyc）——构建前清理 + 产物断言双防线。
#
# actions 按 commit SHA 钉死（zizmor unpinned-uses 门；SHA 后注释为语义版本）。

on:
  push:
    tags: ["v*"]

# 最小权限：workflow 全局只读；发布 job 单独升 contents:write（J9：仅此一项，无 id-token）
permissions:
  contents: read

# 同一 tag 的重复触发串行（防双重发布）
concurrency:
  group: release-${{ github.ref }}

jobs:
  # ── zizmor CI 安全扫描（离线审计；High 即红，Medium 记录不阻塞）──────────
  zizmor:
    name: zizmor 安全扫描（release.yml High 即红）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # 静态扫描不需要 git 凭证（artipacked 门）

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0

      # 门：release.yml 自身有 High 级发现 → 本 job 红 → 下游 release 不发
      - name: 装 uv（runner 不预装 uvx——2026-11-23 实测判例）
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: zizmor 门（High 即红）
        run: uvx zizmor@1.33.1 --no-online-audits --persona auditor --min-severity high .github/workflows/release.yml

      # 记录面：全工作流目录扫描——既有 ci.yml 的发现只记录不阻塞（既有 CI 改良不在本批范围）
      - name: 记录面——全目录扫描（ci.yml 既有发现只记录）
        run: |
          uvx zizmor@1.33.1 --no-online-audits --persona auditor .github/workflows/ || \
            echo "zizmor 全目录扫描存在发现——既有 ci.yml 问题记录在案，不阻塞本流水线"

  # ── 发布 job：测试 → 构建 → pycache 断言 → GitHub Release ──────────────
  release:
    name: 测试 + 构建 + GitHub Release
    needs: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create 附产物所需；PyPI 上传不在此（J9）
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # 发布经 GH_TOKEN env，不依赖 checkout 凭证

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: 安装依赖与构建工具（与 ci.yml 同法 pip -e .[test]；build 供 python -m build）
        run: pip install -e ".[test]" build

      - name: 全量测试（与 ci.yml 同命令）
        run: python -m pytest -q --cov=musespiral --cov-report=term  # python -m 才把 CWD 入 sys.path（tests 互 import 需要）

      - name: 构建前清理 __pycache__（判例 J4 第一道防线）
        run: find musespiral -name __pycache__ -exec rm -rf {} +

      - name: 构建 wheel + sdist
        run: python -m build

      - name: wheel pycache 断言（0.5.0 缺陷 CI 化——必须为 0）
        run: |
          WHL=$(ls dist/*.whl)
          PYC=$(unzip -l "$WHL" | grep -c "__pycache__" || true)
          echo "wheel 内 __pycache__ 条目数：${PYC}"
          if [ "${PYC}" != "0" ]; then
            echo "✗ wheel 含 ${PYC} 个 __pycache__ 条目——构建环境污染，拒绝发布（判例 J4）"
            exit 1
          fi

      - name: 创建 GitHub Release 并附 wheel + sdist
        env:
          GH_TOKEN: ${{ github.token }}        # contents:write（J9：无 PyPI 凭证）
          GH_REF_NAME: ${{ github.ref_name }}  # 经 env 传入 run（模板注入门）
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$GH_REF_NAME" dist/*.whl dist/*.tar.gz \
            --repo "$GH_REPOSITORY" \
            --title "$GH_REF_NAME" \
            --notes-file CHANGELOG.md
