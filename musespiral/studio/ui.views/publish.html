<section id="view-publish" data-view="publish" class="view">
<div class="amb amb-publish" aria-hidden="true"></div>
<div class="view-head">
<div>
<h1 class="view-title">发布中心</h1>
<p class="view-sub" id="queue-sub">加载中…</p>
</div>
<div class="fetch-col">
<div class="fetch-bar">
<input id="fetch-url" class="input" placeholder="mp.weixin.qq.com/s/…" aria-label="微信文章链接">
<button class="btn btn-primary" id="fetch-btn"><span data-icon="download"></span>从 URL 抓取</button>
</div>
<p class="action-hint fetch-hint" id="fetch-hint">微信有频控；批量建议浏览器另存 HTML 走 CLI --html。</p>
</div>
</div>
<div class="funnel-band" id="funnel-band" aria-label="发布漏斗"></div>
<div class="pub-toolbar">
<div class="chips queue-chips" id="queue-filters" aria-label="状态筛选">
<button class="chip is-active" data-filter="all">全部 <span class="chip-count" id="count-all">0</span></button>
<button class="chip" data-filter="draft">草稿 <span class="chip-count" id="count-draft">0</span></button>
<button class="chip" data-filter="pending">待审 <span class="chip-count" id="count-pending">0</span></button>
<button class="chip" data-filter="reviewed">已审 <span class="chip-count" id="count-reviewed">0</span></button>
<button class="chip" data-filter="published">已发布 <span class="chip-count" id="count-published">0</span></button>
<button class="chip" data-filter="fail">有问题 <span class="chip-count" id="count-fail">0</span></button>
</div>
<div class="chips" id="pub-view" aria-label="视图切换">
<button class="chip is-active" data-pview="grid" title="卡片墙">网格</button>
<button class="chip" data-pview="list" title="单行列表">列表</button>
</div>
<button class="btn" id="plan-btn" title="排期周历：计划 / 已交付 / 已发布 三态口径">排期周历</button>
</div>
<div class="queue-drop" id="queue-drop">
<div class="card-grid" id="article-list"></div>
<div id="pub-rows" class="pub-rows" hidden></div>
<div class="empty" id="queue-empty" hidden>
<div class="empty-icon" data-icon="docs"></div>
<div class="empty-title" id="queue-empty-title">暂无文章</div>
<div class="empty-text" id="queue-empty-text">工作目录下还没有文章。拖入 .md 文件自动创建，或用 musespiral notes draft 生成待审文章。</div>
<button class="btn btn-primary empty-action" id="queue-empty-action">刷新队列</button>
</div>
<div class="drop-overlay" id="drop-overlay" hidden>
<span data-icon="upload"></span>
<div class="drop-title">松开鼠标，创建文章</div>
<div class="drop-sub">支持拖入一个或多个 .md 文件</div>
</div>
</div>
</section>
