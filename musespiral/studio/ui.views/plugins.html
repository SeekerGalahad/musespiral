<section id="view-plugins" data-view="plugins" class="view" hidden>
<div class="view-head"><div>
<h1 class="view-title">插件</h1>
<p class="view-sub" id="pg-sub">加载中…</p>
</div>
<div class="action-row">
<button class="btn" id="pg-refresh-btn" title="重扫插件目录（扫描即事实真相）"><span data-icon="refresh"></span>重扫</button>
<button class="btn btn-primary" id="pg-new-btn" title="输入 → 处理 → 输出，保存前契约校验"><span data-icon="plus"></span>新建流水线</button>
</div>
</div>
<div id="pg-list-wrap">
<div class="chips" id="pg-kinds" aria-label="按类型筛选"></div>
<div class="pg-grid" id="pg-grid"></div>
<div class="empty" id="pg-empty" hidden>
<div class="empty-icon" data-icon="settings"></div>
<div class="empty-title">还没有已装插件</div>
<div class="empty-text" id="pg-empty-text">把插件目录放进插件区后点「重扫」。</div>
<div class="action-row empty-actions"><button class="btn btn-primary" id="pg-empty-new">新建流水线</button><button class="btn" id="pg-empty-rescan">重扫目录</button></div>
</div>
</div>
<div id="pg-detail-wrap" hidden></div>
<div id="pg-build-wrap" hidden></div>
</section>
