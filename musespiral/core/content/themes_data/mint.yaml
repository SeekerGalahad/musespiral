name: mint
description: 薄荷科技感，亮底深字的暗色系亮色版
colors:
  primary: "#0d9488"
  text: "#0f172a"
  muted: "#64748b"
  background: "#ffffff"
  code_bg: "#f0fdfa"
  code_text: "#0f172a"
  border: "#e2e8f0"
  quote_bg: "#f0fdfa"
  quote_border: "#0d9488"
typography:
  font_size: "16px"
  line_height: "1.75"
  title_size: "22px"
  title_weight: "700"
  paragraph_margin: "1.2em"
components:
  heading:
    h1: "color: {primary}; font-size: {title_size}; font-weight: {title_weight}; margin: 1.5em 0 0.8em; line-height: 1.4;"
    h2: "color: {primary}; font-size: 19px; font-weight: 600; margin: 1.4em 0 0.7em; padding-bottom: 0.3em; border-bottom: 2px solid {border};"
    h3: "color: {text}; font-size: 17px; font-weight: 600; margin: 1.2em 0 0.6em;"
  paragraph: "color: {text}; font-size: {font_size}; line-height: {line_height}; margin: {paragraph_margin} 0;"
  list: "color: {text}; font-size: {font_size}; line-height: {line_height}; margin: 0.8em 0; padding-left: 1.5em;"
  list_item: "margin: 0.4em 0;"
  quote: "background: {quote_bg}; border-left: 4px solid {quote_border}; padding: 0.8em 1em; margin: 1em 0; color: {muted}; border-radius: 4px;"
  code_block: "background: {code_bg}; color: {code_text}; padding: 1em; border-radius: 6px; overflow-x: auto; font-size: 14px; line-height: 1.6; margin: 1em 0;"
  inline_code: "background: {code_bg}; color: {primary}; padding: 2px 6px; border-radius: 3px; font-size: 0.9em;"
  image: "max-width: 100%; display: block; margin: 1em auto; border-radius: 4px;"
  table: "border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 14px;"
  table_cell: "border: 1px solid {border}; padding: 8px 12px; text-align: left;"
  table_header: "background: {code_bg}; font-weight: 600;"
  hr: "border: none; border-top: 1px solid {border}; margin: 2em 0;"
colors_dark:
  primary: "#2dd4bf"
  text: "#ccfbf1"
  muted: "#94a3b8"
  background: "#042f2e"
  code_bg: "#134e4a"
  code_text: "#ccfbf1"
  border: "#115e59"
  quote_bg: "#134e4a"
  quote_border: "#2dd4bf"
