# 知乎专栏 — 浏览器上传器选择器（F37 平台登记对齐补齐）
# 真机校准前为占位值；CSS 选择器易碎，失效时直接改本文件、不改代码（外置可更新）。
# desc_input 即文章正文编辑器（正文即内容）；publish_button 仅高亮提示，代码永不点击（红线①）。
name: 知乎
entry_url: https://zhuanlan.zhihu.com/write
title_input: 'input[placeholder*="标题"], textarea[placeholder*="标题"]'
desc_input: '.public-DraftEditor-content, [contenteditable="true"]'
topic_input: 'input[placeholder*="话题"], input[placeholder*="绑定话题"]'
cover_input: 'input[type="file"]'
publish_button: 'button:has-text("发布"), Button PublishArticleButton'
