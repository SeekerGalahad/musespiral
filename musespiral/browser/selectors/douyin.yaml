# 抖音创作服务平台 — 浏览器上传器选择器（F16）
# 真机校准前为占位值；CSS 选择器易碎，失效时直接改本文件、不改代码（外置可更新）。
# desc_input 即视频简介/文案框（正文为文案）；publish_button 仅高亮提示，代码永不点击（红线①）。
name: 抖音
entry_url: https://creator.douyin.com/creator-micro/content/upload
title_input: 'input[placeholder*="标题"], .semi-input'
desc_input: '.ql-editor[contenteditable="true"]'
topic_input: 'input[placeholder*="话题"]'
cover_input: 'input[type="file"]'
publish_button: 'button:has-text("发布")'
