# 视频号助手 — 浏览器上传器选择器（F16）
# 真机校准前为占位值；CSS 选择器易碎，失效时直接改本文件、不改代码（外置可更新）。
# publish_button 仅用于定位后高亮提示，代码永不点击（红线①）。
name: 视频号
entry_url: https://channels.weixin.qq.com/platform/post/create
title_input: 'input[placeholder*="标题"]'
desc_input: '[contenteditable="true"]'
topic_input: 'input[placeholder*="话题"]'
cover_input: 'input[type="file"]'
publish_button: '.publish-btn, button:has-text("发表")'
