# 小红书创作服务平台 — 浏览器上传器选择器（F16）
# 真机校准前为占位值；CSS 选择器易碎，失效时直接改本文件、不改代码（外置可更新）。
# desc_input 即笔记正文框（正文即描述）；publish_button 仅高亮提示，代码永不点击（红线①）。
name: 小红书
entry_url: https://creator.xiaohongshu.com/publish/publish
title_input: '#title-textarea, input[placeholder*="标题"]'
desc_input: '#post-textarea, [placeholder*="描述"]'
topic_input: 'input[placeholder*="话题"], .topic-container input'
cover_input: 'input[type="file"]'
publish_button: '.publishBtn, button:has-text("发布")'
