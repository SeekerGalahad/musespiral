<!DOCTYPE html>
<html lang="zh-CN" data-zcode-design>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书籍搜索 · 实时渐进重设计</title>
<style>
:root{
  --paper-0:#faf7f2; --paper-1:#ffffff; --wash:#f3eee6;
  --ink-1:#2b2722; --ink-2:#6b6459; --ink-3:#a39a8d;
  --line-1:#e8e2d6; --line-2:#d4ccbb;
  --vermilion:#c9452c; --vermilion-ink:#a83823;
  --tint:rgba(201,69,44,.08);
  --indigo:#3b5bdb; --jade:#2f9e6e; --amber:#d97706; --crimson:#c92a2a;
  --radius:10px; --radius-pill:999px;
  --fs-h1:22px; --fs-h2:16px; --fs-h3:14px; --fs-body:13.5px; --fs-caption:12px;
  --dur-fast:.15s; --dur-base:.3s;
  --shadow-sm:0 1px 3px rgba(43,39,34,.07);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper-0);color:var(--ink-1);font:var(--fs-body)/1.65 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:1px solid var(--line-2);background:var(--paper-1);border-radius:8px;padding:6px 14px;color:var(--ink-1);transition:border-color var(--dur-fast),background var(--dur-fast)}
button:hover{border-color:var(--ink-3)}
.btn-primary{background:var(--vermilion);border-color:var(--vermilion);color:#fff}
.btn-primary:hover{background:var(--vermilion-ink)}
.btn-ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn-ghost:hover{color:var(--ink-1)}
.btn-sm{padding:3px 10px;font-size:var(--fs-caption)}
.muted{color:var(--ink-2);font-size:var(--fs-caption)}
.wrap{max-width:880px;margin:0 auto;padding:36px 24px 60px}

/* ── 页头 ── */
.view-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
h1{font-size:var(--fs-h1);letter-spacing:-.02em}
.view-sub{color:var(--ink-2);font-size:var(--fs-caption);margin-top:4px}
.flow-note{margin-top:8px;font-size:var(--fs-caption);color:var(--ink-2);background:var(--wash);border:1px solid var(--line-1);border-radius:8px;padding:8px 12px}
.flow-note b{color:var(--ink-1)}

/* ── 搜索区 ── */
.src-search-box{display:flex;align-items:center;gap:10px;height:48px;padding:0 10px 0 14px;background:var(--paper-1);border:1.5px solid var(--line-2);border-radius:12px;transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.src-search-box:focus-within{border-color:var(--vermilion);box-shadow:0 0 0 3px var(--tint)}
.src-search-box input{flex:1;min-width:0;border:0;background:none;font-size:15px;outline:none;height:100%}
.src-search-box svg{width:18px;height:18px;color:var(--ink-3);flex:none}
/* 模式 segmented */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;border-radius:0;padding:6px 12px;font-size:var(--fs-caption);color:var(--ink-2);background:var(--paper-1)}
.seg button.on{background:var(--vermilion);color:#fff;font-weight:600}
.seg button:not(.on):hover{background:var(--wash)}
.kbd{font:11px/1 ui-monospace,monospace;border:1px solid var(--line-2);border-radius:4px;padding:2px 6px;color:var(--ink-3)}

/* ── 进行态：进度条 ── */
.prog-wrap{margin-top:10px}
.prog-line{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-caption);color:var(--ink-2);margin-bottom:5px}
.prog-line b{color:var(--ink-1);font-variant-numeric:tabular-nums}
.prog-bar{height:6px;background:var(--wash);border-radius:3px;overflow:hidden;position:relative}
.prog-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--vermilion),#e07a4f);border-radius:3px;transition:width .4s ease;width:0}
.stop-btn{margin-top:8px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--jade);margin-right:5px;flex:none}
.dot.pulse{animation:pulse 1.2s ease infinite}
@keyframes pulse{50%{opacity:.35}}

/* ── 结果区 ── */
.results{margin-top:22px}
.r-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.r-head h2{font-size:var(--fs-h2)}
.r-sum{color:var(--ink-2);font-size:var(--fs-caption)}
/* 逐源批次分组 */
.src-group{margin-bottom:14px;border:1px solid var(--line-1);border-radius:var(--radius);background:var(--paper-1);overflow:hidden}
.src-group-head{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--wash);font-size:var(--fs-caption);color:var(--ink-2)}
.src-group-head b{color:var(--ink-1);font-weight:600}
.src-group-head .ok-mark{margin-left:auto;color:var(--jade);font-size:11px}
.src-group-head .searching-mark{margin-left:auto;color:var(--amber);font-size:11px}
/* 书卡 */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:1px;background:var(--line-1)}
.book-card{background:var(--paper-1);padding:11px 13px;cursor:pointer;transition:background var(--dur-fast);animation:fadein .45s ease}
.book-card:hover{background:var(--wash)}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.book-name{font-weight:600;font-size:var(--fs-h3);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.book-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:var(--fs-caption);color:var(--ink-2)}
.book-meta .author{color:var(--ink-1)}
.book-kind{border:1px solid var(--line-1);border-radius:4px;padding:0 5px;font-size:10px}
/* 骨架卡（批次占位） */
.sk-card{padding:11px 13px}
.skel{height:11px;border-radius:5px;background:linear-gradient(90deg,var(--wash) 25%,var(--line-1) 45%,var(--wash) 65%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.skel+.skel{margin-top:7px}

/* ── 详情抽屉（懒加载） ── */
.scrim{position:fixed;inset:0;background:rgba(43,39,34,.35);opacity:0;pointer-events:none;transition:opacity var(--dur-base);z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);background:var(--paper-1);border-left:1px solid var(--line-2);box-shadow:-8px 0 30px rgba(43,39,34,.12);transform:translateX(100%);transition:transform var(--dur-base);z-index:41;display:flex;flex-direction:column}
.drawer.open{transform:none}
.d-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-1)}
.d-head b{flex:1;font-size:var(--fs-h3)}
.d-body{flex:1;overflow-y:auto;padding:16px}
.d-foot{padding:12px 16px;border-top:1px solid var(--line-1);display:flex;gap:10px}
/* 详情懒加载态 */
.fetch-hint{display:flex;align-items:center;gap:9px;background:var(--wash);border:1px solid var(--line-1);border-radius:8px;padding:9px 13px;font-size:var(--fs-caption);color:var(--ink-2);margin-bottom:14px}
.fetch-hint.ok{background:rgba(47,158,110,.08);border-color:rgba(47,158,110,.3);color:var(--jade)}
.fetch-hint.err{background:rgba(201,42,42,.06);border-color:rgba(201,42,42,.3);color:var(--crimson)}
.fetch-hint svg{width:15px;height:15px;flex:none}
.bk-cover{width:64px;height:88px;border-radius:6px;background:linear-gradient(135deg,var(--vermilion),#e07a4f);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.bk-head{display:flex;gap:14px}
.bk-info{flex:1;min-width:0}
.bk-info h3{font-size:17px;line-height:1.35}
.bk-sub{margin-top:4px;font-size:var(--fs-caption);color:var(--ink-2);line-height:1.6}
.bk-intro{margin:14px 0;font-size:var(--fs-body);line-height:1.8;color:var(--ink-1)}
.d-sec{margin-top:18px}
.d-sec h4{font-size:var(--fs-h3);margin-bottom:8px}
.toc-item{display:flex;gap:8px;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:var(--fs-caption);color:var(--ink-1)}
.toc-item:hover{background:var(--wash)}
.toc-item .n{color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none;width:22px;text-align:right}
/* 详情骨架 */
.d-skel-block{margin-bottom:12px}

/* 网页阅读演示 */
.web-demo{margin-top:26px;border-top:1px dashed var(--line-2);padding-top:20px}
.web-steps{display:flex;gap:0;margin:12px 0}
.w-step{flex:1;text-align:center;font-size:var(--fs-caption);color:var(--ink-3);position:relative;padding:8px 0}
.w-step.done{color:var(--jade)}
.w-step.doing{color:var(--vermilion)}
.w-step.doing .w-dot{animation:pulse 1.2s ease infinite}
.w-dot{width:9px;height:9px;border-radius:50%;background:var(--line-2);margin:0 auto 5px}
.w-step.done .w-dot{background:var(--jade)}
.w-step.doing .w-dot{background:var(--vermilion)}
.w-step:after{content:"";position:absolute;top:12px;left:calc(50% + 14px);width:calc(100% - 28px);height:1.5px;background:var(--line-1)}
.w-step:last-child:after{display:none}
.w-step.done:after{background:var(--jade)}
</style>
</head>
<body>
<div class="wrap">

  <div class="view-head">
    <div>
      <h1>书籍搜索</h1>
      <p class="view-sub">搜索由 bookengine 提供 · jvm-legado · <b id="src-count">2,554</b> 个书源</p>
      <div class="flow-note">和阅读 app 同一套逻辑：选好模式，搜索时<b>看着一个个书源把结果送回来</b>——不用等全部搜完。点书卡才去取详情，取到取不到都有话。</div>
    </div>
  </div>

  <!-- 搜索区：框 + 模式选择 -->
  <div class="src-search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="6.6"/><path d="M15.9 15.9L20.5 20.5"/></svg>
    <input id="q" type="search" placeholder="搜书名、作者，或粘贴网址直接阅读" autocomplete="off">
    <div class="seg" role="radiogroup" aria-label="搜索模式">
      <button id="mode-parallel" class="on" title="32 线程并发，快">并行 · 快</button>
      <button id="mode-serial" title="逐源串行，慢但适合观察每个源的规则">串行 · 观察</button>
    </div>
    <button id="go" class="btn-primary">搜索</button>
    <span class="kbd">/</span>
  </div>

  <!-- 进行态：进度（搜索中显示） -->
  <div class="prog-wrap" id="prog" hidden>
    <div class="prog-line">
      <span><span class="dot pulse"></span>正在搜索「<b id="prog-q"></b>」· <b id="prog-srcs">0</b> / 2,554 个源已返回</span>
      <span>已找到 <b id="prog-books">0</b> 本</span>
    </div>
    <div class="prog-bar"><i id="prog-fill"></i></div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="muted" id="prog-mode">并行模式 · 45 秒后带回已收集的部分结果</span>
      <button class="btn-sm stop-btn" id="stop">停止搜索</button>
    </div>
  </div>

  <!-- 结果区：逐源分组渐进 -->
  <section class="results" id="results" hidden>
    <div class="r-head">
      <h2>「<span id="r-q"></span>」的搜索结果</h2>
      <span class="r-sum" id="r-sum"></span>
    </div>
    <div id="r-list"></div>
  </section>

  <!-- 网页阅读同理演示 -->
  <section class="web-demo">
    <h2 style="font-size:var(--fs-h2)">网址阅读 · 同理</h2>
    <p class="muted" style="margin-top:4px">粘贴网址回车：抓取 → 正文抽取 → 可入库，每一步都有状态。</p>
    <div class="web-steps" id="web-steps">
      <div class="w-step" data-s="0"><i class="w-dot"></i>请求页面</div>
      <div class="w-step" data-s="1"><i class="w-dot"></i>抽取正文</div>
      <div class="w-step" data-s="2"><i class="w-dot"></i>渲染阅读</div>
    </div>
    <div class="muted" id="web-note">（在搜索框粘贴 https://… 试试）</div>
  </section>

</div>

<!-- 详情抽屉 -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="书籍详情">
  <div class="d-head">
    <button class="btn-ghost" id="back">← 返回列表</button>
    <b>书籍详情</b>
    <button class="btn-ghost" id="close">✕</button>
  </div>
  <div class="d-body" id="d-body"></div>
  <div class="d-foot">
    <button class="btn-primary" id="d-read" style="flex:1">开始阅读 · 取目录</button>
  </div>
</aside>

<script>
/* ── demo 数据与渐进模拟 ── */
var MODE = 'parallel';
var $ = function(id){return document.getElementById(id)};
var DEMO_BATCHES = [
  {src:'SF轻小说', ms:600, books:[
    {name:'斗破苍穹', author:'天蚕土豆', kind:'玄幻', words:'535万字', last:'第1646章 大结局'},
    {name:'斗破苍穹之无上之境', author:'天蚕土豆', kind:'玄幻', words:'118万字', last:'第418章'}]},
  {src:'笔趣阁', ms:700, books:[
    {name:'斗破苍穹', author:'天蚕土豆', kind:'玄幻', words:'534万', last:'第1645章'},
    {name:'武动乾坤', author:'天蚕土豆', kind:'玄幻', words:'410万', last:'第1580章'}]},
  {src:'00小说网', ms:800, books:[
    {name:'斗破苍穹（精校版）', author:'天蚕土豆', kind:'玄幻', words:'535万字', last:'完结'}]},
  {src:'漫客栈', ms:650, books:[
    {name:'斗破苍穹·漫画版', author:'任翔', kind:'漫画', words:'—', last:'第588话'},
    {name:'帝少的心尖宠', author:'佚名', kind:'漫画', words:'—', last:'第312话'}]},
  {src:'书海阁', ms:900, books:[
    {name:'斗破苍穹之轮回', author:'枫色回忆', kind:'同人', words:'86万字', last:'第214章'}]},
  {src:'全本小说网', ms:750, books:[
    {name:'斗破苍穹外传', author:'天蚕土豆', kind:'番外', words:'12万字', last:'第22章'}]}
];
var searching = false, stopFlag = false, timer = null;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

$('mode-parallel').onclick = function(){MODE='parallel';this.classList.add('on');$('mode-serial').classList.remove('on');$('prog-mode').textContent='并行模式 · 45 秒后带回已收集的部分结果'};
$('mode-serial').onclick = function(){MODE='serial';this.classList.add('on');$('mode-parallel').classList.remove('on');$('prog-mode').textContent='串行模式 · 逐源慢搜，适合观察每个源的规则'};

$('go').onclick = doSearch;
$('q').addEventListener('keydown', function(e){if(e.key==='Enter')doSearch()});
$('stop').onclick = function(){stopFlag=true};

function doSearch(){
  var q = $('q').value.trim();
  if(!q){ $('q').focus(); return; }
  if(searching) return;
  if(/^https?:\/\//.test(q)){ demoWeb(q); return; }
  searching = true; stopFlag = false;
  $('prog').hidden = false;
  $('prog-q').textContent = q; $('r-q').textContent = q;
  $('results').hidden = false;
  $('r-list').innerHTML = '';
  var batches = MODE==='serial' ? DEMO_BATCHES : DEMO_BATCHES.slice().sort(function(){return .5-Math.random()});
  var bi = 0, srcs = 0, books = 0;
  function nextBatch(){
    if(stopFlag || bi >= batches.length){ finish(); return; }
    var b = batches[bi++];
    // 该源骨架组先出现（「正在搜」）→ 批次回来后填实
    var g = renderGroup(b.src, true);
    setTimeout(function(){
      if(stopFlag){ g.remove(); finish(); return; }
      fillGroup(g, b);
      srcs++; books += b.books.length;
      $('prog-srcs').textContent = (srcs*426);
      $('prog-books').textContent = books;
      $('prog-fill').style.width = Math.min(96, (bi/batches.length)*100) + '%';
      $('r-sum').textContent = MODE==='parallel' ? '并行 · '+srcs+' 源已返回 · '+books+' 本' : '串行 · 第 '+srcs+' 个源 · '+books+' 本';
      setTimeout(nextBatch, MODE==='serial' ? 900 : 120);
    }, b.ms);
  }
  nextBatch();
}
function finish(){
  searching = false;
  $('prog').hidden = true;
  if(!$('r-list').children.length){
    $('r-sum').textContent = '没有任何源返回结果';
  }
}
function renderGroup(srcName, pending){
  var g = document.createElement('div');
  g.className = 'src-group';
  g.innerHTML = '<div class="src-group-head"><b>'+esc(srcName)+'</b><span class="'+(pending?'searching-mark':'ok-mark')+'">'+(pending?'正在搜…':'已返回')+'</span></div>'+
    '<div class="book-grid">'+ (pending ? '<div class="book-card sk-card"><div class="skel" style="width:70%"></div><div class="skel" style="width:45%"></div></div>' : '') +'</div>';
  $('r-list').appendChild(g);
  return g;
}
function fillGroup(g, b){
  var head = g.querySelector('.src-group-head');
  head.querySelector('.searching-mark, .ok-mark').outerHTML = '<span class="ok-mark">✓ 已返回</span>';
  var grid = g.querySelector('.book-grid');
  grid.innerHTML = b.books.map(function(bk,i){
    return '<div class="book-card" data-name="'+esc(bk.name)+'" data-src="'+esc(b.src||b&&0||'')+'" onclick="openDetail(this)">'+
      '<div class="book-name">'+esc(bk.name)+'</div>'+
      '<div class="book-meta"><span class="author">'+esc(bk.author)+'</span>'+
      (bk.kind?'<span class="book-kind">'+esc(bk.kind)+'</span>':'')+
      (bk.words?'<span>'+esc(bk.words)+'</span>':'')+
      '<span>'+esc(bk.last)+'</span></div></div>';
  }).join('');
}

/* ── 详情：点开才取（懒加载），成败有话 ── */
function openDetail(card){
  var name = card.dataset.name;
  $('scrim').classList.add('open');
  $('drawer').classList.add('open');
  // 懒加载骨架 + 「正在获取」提示
  $('d-body').innerHTML =
    '<div class="fetch-hint"><span class="dot pulse"></span>正在从「'+esc(name)+'」的源获取详情…（点击时才取，列表不预载）</div>'+
    '<div class="bk-head"><div class="bk-cover">'+esc(name.slice(0,1))+'</div><div class="bk-info">'+
    '<div class="d-skel-block"><div class="skel" style="width:75%;height:14px"></div></div>'+
    '<div class="d-skel-block"><div class="skel" style="width:55%"></div></div>'+
    '<div class="d-skel-block"><div class="skel" style="width:40%"></div></div></div></div>'+
    '<div class="d-skel-block"><div class="skel" style="width:100%;height:60px"></div></div>';
  // demo：90% 成功 / 10% 失败
  setTimeout(function(){
    if(Math.random() < 0.1){
      $('d-body').innerHTML =
        '<div class="fetch-hint err"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4L2.8 19.6h18.4L12 4z"/><path d="M12 10v4.2"/><path d="M12 17.3h.01"/></svg>详情获取失败：该源响应超时（504）。可以重试，或换一个源。</div>'+
        '<div class="bk-head"><div class="bk-cover">'+esc(name.slice(0,1))+'</div><div class="bk-info"><h3>'+esc(name)+'</h3><p class="bk-sub">来自搜索结果 · 详情尚未取到</p></div></div>'+
        '<button class="btn-sm" style="margin-top:14px" onclick="retryDetail(\''+esc(name)+'\')">重试获取</button>'+
        ' <button class="btn-sm" style="margin-top:14px">换源（3 个源有此书）</button>';
      return;
    }
    $('d-body').innerHTML =
      '<div class="fetch-hint ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4.5 12.6l4.8 4.8L19.5 6.9"/></svg>详情已获取（来自源 · 耗时 0.8s）</div>'+
      '<div class="bk-head"><div class="bk-cover">'+esc(name.slice(0,1))+'</div><div class="bk-info"><h3>'+esc(name)+'</h3>'+
      '<p class="bk-sub">天蚕土豆 · 玄幻 · 535万字<br>最新：第1646章 大结局（3天前）</p></div></div>'+
      '<p class="bk-intro">这里是主角萧炎的陨落与崛起的故事——三十年河东，三十年河西，莫欺少年穷！……（简介来自源，获取时才有）</p>'+
      '<div class="d-sec"><h4>目录</h4><p class="muted" style="margin-bottom:8px">目录与正文同为点击时取——「开始阅读」才拉。</p></div>';
  }, 900);
}
function retryDetail(name){
  openDetail({dataset:{name:name}});
}
/* 返回：关抽屉，列表原样（含滚动位置） */
function closeDrawer(){
  $('scrim').classList.remove('open');
  $('drawer').classList.remove('open');
}
$('back').onclick = closeDrawer;
$('close').onclick = closeDrawer;
$('scrim').onclick = closeDrawer;
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeDrawer(); });

/* ── 网址阅读步骤演示 ── */
function demoWeb(url){
  var steps = $('web-steps').children;
  for(var i=0;i<steps.length;i++){steps[i].className='w-step'}
  $('web-note').textContent = '正在读取 '+url+' …';
  var si = 0;
  function tick(){
    if(si>0) steps[si-1].className = 'w-step done';
    if(si>=steps.length){ $('web-note').textContent = '✓ 已读出正文（2,140 字）· 读完可「存入素材库」或「存入待决区」'; return; }
    steps[si].className = 'w-step doing';
    si++;
    setTimeout(tick, 700);
  }
  tick();
}
/* `/` 聚焦 */
document.addEventListener('keydown', function(e){
  if(e.key==='/' && document.activeElement !== $('q')){ e.preventDefault(); $('q').focus(); }
});
</script>
