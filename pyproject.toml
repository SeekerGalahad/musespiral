[project]
name = "musespiral"
version = "0.6.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Open content pipeline: media in, publishable drafts out — every AI judgement stays a suggestion you can accept, regenerate or discard"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "content-pipeline",
    "ai-writing",
    "video-to-article",
    "human-in-the-loop",
    "llm",
    "markdown",
    "plugin-system",
    "transcription",
    "whisper",
    "wechat",
    "content-creation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "Pygments>=2.17.0",
    "mistune>=3.0.0",
    "python-frontmatter>=1.0.0",
    "PyYAML>=6.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    # B 采集扩展（第二十一期 §十 R-B2 实施修订裁决引入——B 设计正典回写条目）
    "feedparser>=6.0",
    "readability-lxml>=0.9",
    # G-T5 TTS 朗读（调研吸收 §六，2026-11-19；设计 §6.2 原文的 `pip install
    # edge-tts` 收编进依赖表）：微软免费 TTS、零 API key。**出口性质**=包内打
    # speech.platform.bing.com 一族——外部服务而非 LLM，**不经 musespiral 的 LLM
    # gateway**、不进 ai.json 档案/TASKS/routing。服务层仍保留调用期探测
    # （源码目录未 pip install -e 时给可读安装引导，不让整个包 import 失败）。
    "edge-tts>=7.0",
    # doc-extract 插件 EPUB 提取的 HTML 解析（2026-11-20 格式生态线：任务书
    # 误记「bs4 已在依赖表」，实测不在——补正为正式依赖；PDF/DOCX/EPUB 三路
    # 解析库（pdfplumber/python-docx/ebooklib）保持可选依赖，未装时插件
    # /check 报 MISSING_DEP、运行给可读指引，不随主包强制）
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# ARCH-3 工程基础设施（2026-11-21，正典=docs/项目方案/musespiral-极限架构与功能扩展总规划-2026-11-21.md §ARCH-3）
# pytest-cov 进 test 组：CI 首步 `pytest -q --cov=musespiral`（ci.yml）依赖它，
# 不在则 pytest 对未知参数直接报错退出——覆盖报告必须是 test 面自带能力。
test = ["pytest", "pytest-cov", "numpy", "pdfplumber", "python-docx"]  # CI 全量面：numpy=PCM fixture；pdfplumber/python-docx=doc-extract 后端（裸装判例 2026-11-23）
docs = ["markitdown", "mammoth", "pdfplumber", "python-docx"]  # 文档提取全家（自研后端 pdfplumber/python-docx 2026-11-23 补声明——此前打包缺口：后端不在任何 extra）
media = ["faster-whisper"]             # 音视频转写（subtitle 插件可选后端）
browser = ["playwright>=1.40"]         # 视觉截图（browser 组，原有）
# 开发全家桶：一条命令装齐测试/类型/格式/钩子工具
dev = ["pytest", "pytest-cov", "mypy", "black", "isort", "flake8", "pre-commit"]

[project.scripts]
musespiral = "musespiral.cli:cli"

[project.urls]
Homepage = "https://github.com/SeekerGalahad/musespiral"
Documentation = "https://github.com/SeekerGalahad/musespiral/blob/main/ARCHITECTURE.md"
Repository = "https://github.com/SeekerGalahad/musespiral"
Issues = "https://github.com/SeekerGalahad/musespiral/issues"
Changelog = "https://github.com/SeekerGalahad/musespiral/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.mypy]
# ARCH-3 渐进类型检查（2026-11-21）：本批只配置不修错——core/ strict 的错误数
# 作为 baseline 记录于批次交付报告，后续批次逐步清零后再收紧 services 与其余层。
python_version = "3.10"
ignore_missing_imports = true   # 第三方库普遍无 stub（frontmatter 等），渐进期静默
follow_imports = "silent"       # 错误只落在命令行显式指定的层，被跟随导入不外溢报错

[[tool.mypy.overrides]]
# 纯逻辑层，最适合严格类型检查
module = "musespiral.core.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# 服务层先开基础检查，逐步向 strict 收紧
module = "musespiral.services.*"
check_untyped_defs = true

[[tool.mypy.overrides]]
# infra/studio 暂豁免（JS/HTML 混合与重 IO），后续批次逐步收紧
module = ["musespiral.infra.*", "musespiral.studio.*"]
ignore_errors = true

[tool.setuptools.packages.find]
include = ["musespiral*"]

[tool.setuptools.package-data]
# M1 双层产物（2026-11-18 前端多文件化）：壳 ui.html + assets/core.js|css 随包发布
# `studio/assets/**` 取递归——M3 按视图拆分后 assets/views/*.js 落在子目录，单层
# glob `studio/assets/*` 实测只收一层（嵌套层漏装，wheel 解包探针验证过）
# `plugins_builtin/**`（首插件族 2026-11-20）：官方内置插件随包分发（非 Python
# 包目录，loader 按文件路径加载；递归 glob 收 manifest.json + plugin.py）
musespiral = ["core/content/themes_data/*.yaml", "studio/ui.html", "studio/assets/**", "browser/selectors/*.yaml", "plugins_builtin/**"]
