      <p style="color: #333333; font-size: 15px; line-height: 1.75;">第一步，先量再调：用现有监控拿到命中率与慢查询清单，别凭感觉下结论。</p>
      <p style="color: #333333; font-size: 15px; line-height: 1.75;">第二步，收窄键：大对象拆字段、长键做摘要，缓存的是「取得最多的那部分」。</p>
      <p>第三步，给失效留退路：<span style="color: #c2410c;">同一份数据只留一个失效口径</span>，回源加合并，雪崩就少了大半。</p>
      <p style="color: #c2410c; font-size: 17px;">检查清单：命中率、回源峰值、失效口径，三个数字对齐再谈收益。</p>
